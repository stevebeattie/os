package:
  name: ruby3.4-net-scp
  version: "4.1.0"
  epoch: 0
  description: Pure Ruby implementation of the SCP protocol
  copyright:
    - license: Ruby
    - license: MIT
  dependencies:
    runtime:
      #- ruby${{vars.rubyMM}}-date
      - ruby${{vars.rubyMM}}-net-ssh

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.rubyMM}}
      - ruby-${{vars.rubyMM}}-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 29e2c4a7f69cef75dc686d4616a6da45b619a7ae
      repository: https://github.com/net-ssh/net-scp
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: net-scp

update:
  enabled: true
  github:
    identifier: net-ssh/net-scp
    strip-prefix: v
    use-tag: true

var-transforms:
  - from: ${{package.name}}
    match: ^ruby(\d\.\d+)-.*
    replace: $1
    to: rubyMM

test:
  environment:
    contents:
      packages:
        - build-base
        - ruby-${{vars.rubyMM}}-dev
        - ruby${{vars.rubyMM}}-bundler
        - ruby${{vars.rubyMM}}-json
        - ruby${{vars.rubyMM}}-psych
        - ruby${{vars.rubyMM}}-stringio
  pipeline:
    - runs: |
        # Test that our installed package is importable
        ruby -e "require 'net/scp'"
    - uses: git-checkout
      with:
        expected-commit: 29e2c4a7f69cef75dc686d4616a6da45b619a7ae
        repository: https://github.com/net-ssh/net-scp
        tag: v${{package.version}}
    - runs: |
        # Run upstream tests: against the repo's code not our installed
        # package, but at least find out if we have incompatibilities
        bundle install
        bundle exec rake test
